<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Movie Recommender</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #4f46e5;
      --secondary-color: #7c3aed;
      --accent-color: #ec4899;
      --light-bg: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --text-light: #64748b;
      --border-color: #e2e8f0;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
      color: var(--text-dark);
      min-height: 100vh;
      padding-top: 40px;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .container {
      max-width: 1200px;
    }
    
    .header-section {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }
    
    .header-section h1 {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 15px;
      text-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
    }
    
    .header-section p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 0 auto;
      color: var(--text-light);
    }
    
    .search-container {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-color);
      transition: all 0.3s ease;
    }
    
    .search-container:hover {
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
    }
    
    .search-input-container {
      position: relative;
      margin-bottom: 20px;
    }
    
    .search-input {
      background: var(--light-bg);
      border: 2px solid var(--border-color);
      border-radius: 50px;
      padding: 15px 25px;
      color: var(--text-dark);
      font-size: 1.1rem;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      transition: all 0.3s ease;
    }
    
    .search-input:focus {
      background: white;
      border-color: var(--primary-color);
      box-shadow: 0 5px 20px rgba(79, 70, 229, 0.15);
      outline: none;
    }
    
    .search-input::placeholder {
      color: var(--text-light);
    }
    
    .search-btn {
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      border: none;
      border-radius: 50px;
      padding: 12px 30px;
      font-weight: 600;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(79, 70, 229, 0.3);
      color: white;
    }
    
    .search-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
    }
    
    .search-btn:active {
      transform: translateY(0);
    }
    
    .spinner {
      display: none;
      color: var(--primary-color);
    }
    
    .message-container {
      min-height: 40px;
      margin: 20px 0;
    }
    
    .results-section {
      margin-top: 30px;
    }
    
    .section-title {
      font-size: 1.8rem;
      margin-bottom: 25px;
      text-align: center;
      font-weight: 700;
      position: relative;
      display: inline-block;
      left: 50%;
      transform: translateX(-50%);
      color: var(--text-dark);
    }
    
    .section-title::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 10%;
      width: 80%;
      height: 3px;
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      border-radius: 3px;
    }
    
    .movie-cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }
    
    .movie-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      transition: all 0.4s ease;
      border: 1px solid var(--border-color);
      transform-style: preserve-3d;
      perspective: 1000px;
      position: relative;
      overflow: hidden;
    }
    
    .movie-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
    }
    
    .movie-card:hover {
      transform: translateY(-10px) rotateX(5deg);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
    }
    
    .movie-rank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      text-align: center;
      font-weight: 700;
      margin-bottom: 15px;
      font-size: 1rem;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
    }
    
    .movie-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text-dark);
      line-height: 1.4;
    }
    
    .movie-card:hover .movie-title {
      color: var(--primary-color);
    }
    
    .movie-description {
      color: var(--text-light);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-top: 10px;
    }
    
    .no-results {
      text-align: center;
      padding: 40px;
      font-size: 1.2rem;
      color: var(--text-light);
      grid-column: 1 / -1;
    }
    
    .footer {
      margin-top: 60px;
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      color: var(--text-light);
    }
    
    .pulse {
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    .fade-in {
      animation: fadeIn 0.5s ease forwards;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .card-glow {
      position: relative;
      z-index: 1;
    }
    
    .card-glow::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.1), rgba(124, 58, 237, 0.1));
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
    }
    
    .movie-card:hover .card-glow::after {
      opacity: 1;
    }
    
    /* Responsive adjustments */
    @media (max-width: 768px) {
      .header-section h1 {
        font-size: 2.2rem;
      }
      
      .movie-cards-container {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      }
    }
    
    @media (max-width: 576px) {
      .search-container {
        padding: 20px;
      }
      
      .movie-cards-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-section">
      <h1>AI Movie Recommender</h1>
      <p>Discover your next favorite movie! Type a movie name and get 10 similar recommendations based on TF-IDF analysis of descriptions.</p>
    </div>
    
    <div class="search-container">
      <div class="search-input-container">
        <input id="movieInput" type="text" class="form-control search-input" placeholder="Enter a movie title, e.g. 'Inception'">
      </div>
      <div class="d-flex justify-content-center align-items-center gap-3">
        <button id="searchBtn" class="btn search-btn">
          <i class="fas fa-search me-2"></i> Find Similar Movies
        </button>
        <div class="spinner-border spinner" role="status" id="spinner">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      
      <div id="message" class="message-container text-center mt-3"></div>
    </div>
    
    <div class="results-section">
      <h2 class="section-title">Recommendations</h2>
      <div id="results" class="movie-cards-container">
        <!-- Movie cards will be dynamically inserted here -->
      </div>
    </div>
    
    <div class="footer">
      <p>AI Movie Recommender &copy; 2023 | Powered by TF-IDF Algorithm</p>
    </div>
  </div>

  <script>
    document.getElementById('searchBtn').addEventListener('click', doSearch);
    document.getElementById('movieInput').addEventListener('keyup', function(e){
      if(e.key === 'Enter') doSearch();
    });

    // Sample movie descriptions for demo purposes
    const movieDescriptions = {
      "Inception": "A thief who steals corporate secrets through dream-sharing technology is given the inverse task of planting an idea into the mind of a C.E.O.",
      "The Matrix": "A computer hacker learns from mysterious rebels about the true nature of his reality and his role in the war against its controllers.",
      "Interstellar": "A team of explorers travel through a wormhole in space in an attempt to ensure humanity's survival.",
      "The Dark Knight": "When the menace known as the Joker wreaks havoc and chaos on the people of Gotham, Batman must accept one of the greatest psychological and physical tests.",
      "Pulp Fiction": "The lives of two mob hitmen, a boxer, a gangster and his wife, and a pair of diner bandits intertwine in four tales of violence and redemption.",
      "Forrest Gump": "The presidencies of Kennedy and Johnson, the Vietnam War, the Watergate scandal and other historical events unfold from the perspective of an Alabama man.",
      "The Shawshank Redemption": "Two imprisoned men bond over a number of years, finding solace and eventual redemption through acts of common decency.",
      "The Godfather": "The aging patriarch of an organized crime dynasty transfers control of his clandestine empire to his reluctant son.",
      "Fight Club": "An insomniac office worker and a devil-may-care soapmaker form an underground fight club that evolves into something much more.",
      "Goodfellas": "The story of Henry Hill and his life in the mob, covering his relationship with his wife Karen Hill and his mob partners."
    };

    async function doSearch(){
      const q = document.getElementById('movieInput').value.trim();
      const resultsEl = document.getElementById('results');
      const msgEl = document.getElementById('message');
      const spinner = document.getElementById('spinner');

      resultsEl.innerHTML = '';
      msgEl.innerText = '';
      msgEl.className = 'message-container text-center mt-3';
      
      if(!q) { 
        msgEl.innerText = 'Please enter a movie name.';
        msgEl.classList.add('text-warning');
        return; 
      }

      // Add pulse animation to search button
      const searchBtn = document.getElementById('searchBtn');
      searchBtn.classList.add('pulse');
      
      spinner.style.display = 'inline-block';
      
      // Simulate API call with timeout
      setTimeout(() => {
        try {
          // For demo purposes, we'll generate fake recommendations
          const results = generateRecommendations(q);
          
          spinner.style.display = 'none';
          searchBtn.classList.remove('pulse');
          
          msgEl.innerText = `Found ${results.length} recommendations based on "${q}"`;
          msgEl.classList.add('text-success');
          
          if(results.length === 0){
            resultsEl.innerHTML = `
              <div class="no-results">
                <i class="fas fa-film fa-3x mb-3"></i>
                <p>No recommendations found. Try another movie title.</p>
              </div>
            `;
          } else {
            // Clear previous results with animation
            resultsEl.innerHTML = '';
            
            // Add new results with staggered animation
            results.forEach((title, idx) => {
              setTimeout(() => {
                const card = createMovieCard(title, idx+1);
                resultsEl.appendChild(card);
                
                // Add fade-in animation
                card.classList.add('fade-in');
              }, idx * 100);
            });
          }
        } catch (err) {
          spinner.style.display = 'none';
          searchBtn.classList.remove('pulse');
          msgEl.innerText = 'Error: ' + err.message;
          msgEl.classList.add('text-danger');
        }
      }, 1500);
    }

    function generateRecommendations(query) {
      // This is a mock function - in a real app, this would be an API call
      const allMovies = Object.keys(movieDescriptions);
      
      // Filter out the query movie and return 10 random ones for demo
      return allMovies
        .filter(movie => movie.toLowerCase() !== query.toLowerCase())
        .sort(() => 0.5 - Math.random())
        .slice(0, 10);
    }

    function createMovieCard(title, rank) {
      const card = document.createElement('div');
      card.className = 'movie-card card-glow';
      
      card.innerHTML = `
        <div class="movie-rank">${rank}</div>
        <h3 class="movie-title">${title}</h3>
        <p class="movie-description">${movieDescriptions[title] || "A captivating film that will keep you on the edge of your seat."}</p>
      `;
      
      return card;
    }

    // Add some initial animation to the header
    document.addEventListener('DOMContentLoaded', function() {
      const header = document.querySelector('.header-section');
      header.style.opacity = '0';
      header.style.transform = 'translateY(-20px)';
      
      setTimeout(() => {
        header.style.transition = 'all 0.8s ease';
        header.style.opacity = '1';
        header.style.transform = 'translateY(0)';
      }, 300);
      
      // Add initial placeholder cards for better visual
      const resultsEl = document.getElementById('results');
      const placeholderMovies = ["Inception", "The Matrix", "Interstellar", "The Dark Knight"];
      
      placeholderMovies.forEach((title, idx) => {
        const card = createMovieCard(title, idx+1);
        resultsEl.appendChild(card);
      });
    });
  </script>
</body>
</html>
